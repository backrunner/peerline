name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel."
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - stable
      publish:
        description: "Publish to npm. Leave false for a full dry run."
        required: true
        type: boolean
        default: false
      github_release:
        description: "Create a GitHub release before npm publish."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Lint
        run: npm run lint

      - name: Rust tests
        run: npm run test:rust

      - name: Node tests
        run: npm run test:node

      - name: Dry-run main package
        run: npm pack --dry-run --json

  build-platform:
    name: Platform ${{ matrix.package }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: peerline-linux-x64-gnu
            os: ubuntu-24.04
            rust_target: ""
            musl: false
          - package: peerline-linux-arm64-gnu
            os: ubuntu-24.04-arm
            rust_target: ""
            musl: false
          - package: peerline-linux-x64-musl
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            musl: true
          - package: peerline-linux-arm64-musl
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            musl: true
          - package: peerline-darwin-arm64
            os: macos-15
            rust_target: ""
            musl: false
          - package: peerline-darwin-x64
            os: macos-15-intel
            rust_target: ""
            musl: false
          - package: peerline-win32-x64-msvc
            os: windows-2022
            rust_target: ""
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install musl tools
        if: ${{ matrix.musl }}
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify platform package name
        shell: bash
        env:
          PEERLINE_PLATFORM_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          actual="$(node -e 'const release = require("./npm/release.js"); process.stdout.write(release.platformPackageInfo(process.env.PEERLINE_PLATFORM_PACKAGE, "0.0.0").name)')"
          expected="$PEERLINE_PLATFORM_PACKAGE"
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected but runner resolves to $actual" >&2
            exit 1
          fi

      - name: Build platform release asset
        shell: bash
        env:
          PEERLINE_PLATFORM_PACKAGE: ${{ matrix.package }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          npm run build:platform-asset -- --platform-package="$PEERLINE_PLATFORM_PACKAGE"

      - name: Upload platform asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  publish-main:
    name: Main package
    needs:
      - build-platform
      - github-release
    if: ${{ always() && needs['build-platform'].result == 'success' && (needs['github-release'].result == 'success' || needs['github-release'].result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish or dry-run main package
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.publish) || '' }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}
        run: |
          set -euo pipefail
          should_publish="${SHOULD_PUBLISH:-}"
          if [ -z "$should_publish" ]; then
            should_publish=true
          fi

          release_channel="${RELEASE_CHANNEL:-}"
          if [ -z "$release_channel" ]; then
            version="$(node -p "require('./package.json').version")"
            case "$version" in
              *-alpha.*) release_channel=alpha ;;
              *-beta.*) release_channel=beta ;;
              *) release_channel=stable ;;
            esac
          fi

          flags=(--current --main-only --skip-tests --no-commit)
          if [ "$should_publish" = "true" ]; then
            flags+=(--ignore-existing)
          else
            flags+=(--no-publish)
          fi
          npm run "release:$release_channel" -- "${flags[@]}"

  github-release:
    name: GitHub release
    needs: build-platform
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.github_release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          release_channel="stable"
          case "$version" in
            *-alpha.*) release_channel=alpha ;;
            *-beta.*) release_channel=beta ;;
          esac

          args=(release create "$tag" --title "Peerline $version" --generate-notes)
          if [ "$release_channel" != "stable" ]; then
            args+=(--prerelease)
          fi
          mapfile -t assets < <(find dist-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under dist-assets" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh "${args[@]}"
          fi
          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$asset" --clobber
          done

      - name: Cleanup older prereleases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          current_tag="v$version"
          case "$version" in
            *-alpha.*) tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$' ;;
            *-beta.*) tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' ;;
            *) exit 0 ;;
          esac

          {
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName'
            git ls-remote --tags origin 'v*' | awk -F/ '{print $NF}'
          } | sort -u | grep -E "$tag_pattern" | grep -vFx "$current_tag" > stale-tags.txt || true

          while IFS= read -r stale_tag; do
            if [ -z "$stale_tag" ]; then
              continue
            fi
            if gh release view "$stale_tag" >/dev/null 2>&1; then
              gh release delete "$stale_tag" --yes --cleanup-tag
            else
              git push origin ":refs/tags/$stale_tag"
            fi
          done < stale-tags.txt
