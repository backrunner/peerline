name: Release Packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel."
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - stable
      publish:
        description: "Publish to npm. Leave false for a full dry run."
        required: true
        type: boolean
        default: false
      github_release:
        description: "Create a GitHub release after npm publish."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Dry-run main package
        run: npm pack --dry-run --json

  publish-platform:
    name: Platform ${{ matrix.package }}
    needs: validate
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: peerline-linux-x64-gnu
            os: ubuntu-24.04
            rust_target: ""
            musl: false
          - package: peerline-linux-arm64-gnu
            os: ubuntu-24.04-arm
            rust_target: ""
            musl: false
          - package: peerline-linux-x64-musl
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            musl: true
          - package: peerline-linux-arm64-musl
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            musl: true
          - package: peerline-darwin-arm64
            os: macos-14
            rust_target: ""
            musl: false
          - package: peerline-darwin-x64
            os: macos-13
            rust_target: ""
            musl: false
          - package: peerline-win32-x64-msvc
            os: windows-2022
            rust_target: ""
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install musl tools
        if: ${{ matrix.musl }}
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify platform package name
        shell: bash
        env:
          PEERLINE_PLATFORM_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          actual="$(node -e 'const release = require("./npm/release.js"); process.stdout.write(release.platformPackageInfo(process.env.PEERLINE_PLATFORM_PACKAGE, "0.0.0").name)')"
          expected="$PEERLINE_PLATFORM_PACKAGE"
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected but runner resolves to $actual" >&2
            exit 1
          fi

      - name: Publish or dry-run platform package
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ inputs.publish }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PEERLINE_PLATFORM_PACKAGE: ${{ matrix.package }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          flags=(--current --platform-only --skip-tests --no-commit)
          flags+=(--platform-package="$PEERLINE_PLATFORM_PACKAGE")
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            flags+=(--ignore-existing)
          else
            flags+=(--no-publish)
          fi
          npm run "release:$RELEASE_CHANNEL" -- "${flags[@]}"

  publish-main:
    name: Main package
    needs: publish-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish or dry-run main package
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ inputs.publish }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          flags=(--current --main-only --skip-tests --no-commit)
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            flags+=(--ignore-existing)
          else
            flags+=(--no-publish)
          fi
          npm run "release:$RELEASE_CHANNEL" -- "${flags[@]}"

  github-release:
    name: GitHub release
    needs: publish-main
    if: ${{ inputs.publish && inputs.github_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi

          args=(release create "$tag" --title "Peerline $version" --generate-notes)
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
