[workspace]
members = [
    "crates/peerline-cli",
    "crates/peerline-core",
    "crates/peerline-crypto",
    "crates/peerline-net",
    "crates/peerline-rendezvous-model",
    "crates/peerline-testkit",
    "crates/peerline-transfer",
    "crates/peerline-tui",
]
exclude = ["services/peerline-rendezvous"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/backrunner/peerline"
version = "0.1.1-beta.2"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
assert_cmd = "2.2.2"
async-trait = "0.1.92"
ble-peripheral-rust = "0.2.0"
btleplug = "0.13.5"
uuid = { version = "1.29.2", features = ["v4"] }
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
crab_nat = "0.8.1"
default-net = "0.22.0"
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
if-addrs = "0.15.0"
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
libp2p = { version = "0.57.1", default-features = false, features = [
    "autonat",
    "dcutr",
    "dns",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "quic",
    "relay",
    "rendezvous",
    "request-response",
    "tcp",
    "tokio",
    "upnp",
    "yamux",
] }
libp2p-webrtc = { version = "0.10.0-alpha", features = ["tokio"] }
local-ip-address = "0.6.13"
lzma-rs = "0.3.0"
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
# Published pre.2 still pins vulnerable crypto-bigint 0.5; upstream's dependency
# migration is pinned until its next release (RUSTSEC-2026-0387).
opaque-ke = { git = "https://github.com/facebook/opaque-ke", rev = "070eac916fa58c71029a13021c127861f58d11d1", features = ["argon2", "std"] }
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = "1.12.0"
pkarr = { version = "9.0.0", default-features = false, features = ["dht"] }
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zstd = "0.14.4"

[profile.release]
strip = "symbols"

[patch.crates-io]
ble-peripheral-rust = { path = "vendor/ble-peripheral-rust" }
libp2p-webrtc = { path = "vendor/libp2p-webrtc" }
