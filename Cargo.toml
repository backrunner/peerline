[workspace]
members = [
    "crates/peerline-cli",
    "crates/peerline-core",
    "crates/peerline-crypto",
    "crates/peerline-net",
    "crates/peerline-testkit",
    "crates/peerline-transfer",
    "crates/peerline-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/peerline/peerline"
version = "0.1.0-alpha.1"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
assert_cmd = "2.0.18"
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
hex = "0.4.3"
hkdf = "0.12.4"
libp2p = { version = "0.56.0", default-features = false, features = [
    "autonat",
    "dcutr",
    "dns",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "quic",
    "relay",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio"] }
local-ip-address = "0.6.12"
lzma-rs = "0.3.0"
ml-kem = { version = "0.3.0", features = ["getrandom", "zeroize"] }
opaque-ke = { version = "4.1.0-pre.2", features = ["argon2", "std"] }
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = "1.9.0"
rand = "0.8.5"
ratatui = "0.29.0"
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec", "io"] }
toml = "0.9.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }
zstd = "0.13.3"
