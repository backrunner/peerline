[package]
name = "peerline-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
plist = "1.10.3"

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
crab_nat.workspace = true
default-net.workspace = true
futures.workspace = true
hmac.workspace = true
if-addrs = { workspace = true, features = ["link-local"] }
igd-next.workspace = true
libp2p.workspace = true
libp2p-webrtc.workspace = true
local-ip-address.workspace = true
rand.workspace = true
peerline-core = { path = "../peerline-core" }
peerline-crypto = { path = "../peerline-crypto" }
peerline-rendezvous-model = { path = "../peerline-rendezvous-model" }
peerline-transfer = { path = "../peerline-transfer" }
pkarr.workspace = true
postcard.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-socks.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
ble-peripheral-rust.workspace = true
btleplug.workspace = true
uuid.workspace = true

[dev-dependencies]
mainline = "8"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
libc = "0.2.191"
rcgen = "0.14.10"
socket2 = { version = "0.6.5", features = ["all"] }
tokio-rustls = "0.26.6"
