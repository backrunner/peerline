[package]
name = "peerline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "peerline"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures.workspace = true
rand.workspace = true
peerline-core = { path = "../peerline-core" }
peerline-net = { path = "../peerline-net" }
peerline-tui = { path = "../peerline-tui" }
peerline-transfer = { path = "../peerline-transfer" }
libp2p.workspace = true
ratatui.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[dev-dependencies]
mainline = "8"
assert_cmd.workspace = true
blake3.workspace = true
pkarr.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
